name: Deploy web-server files via FTP

on:
  push:
    branches:
      - master
    paths:
      - 'backend/web-server/**'

  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Upload files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_NAME }}
          password: ${{ secrets.FTP_SECRET }}

          local-dir: ./backend/web-server/
          server-dir: /public_html/server/