name: 🚀 Build and Deploy Source
on:
  push:
    paths:
      - 'frontend/**'
jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: Use Node.js 18
        uses: actions/setup-node@v2
        with:
          node-version: '18'

      - name: 🔨 Build Project
        run: |
          cd frontend
          npm install
          npm run build-pwa

      - name: 📂 Sync files
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          local-dir: './frontend/dist/pwa/'
          server-dir: 'public_html/'
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_NAME }}
          password: ${{ secrets.FTP_SECRET }}
